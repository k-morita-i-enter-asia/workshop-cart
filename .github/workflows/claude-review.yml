name: Claude Review
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            `gh pr diff` でこの PR の差分を取得してください。
            リポジトリの CLAUDE.md と .claude/agents/code-reviewer.md を読み、その確認項目に沿って差分をレビューしてください。

            ファイル固有の指摘には `mcp__github_inline_comment__create_inline_comment` を使い、`confirmed: true` を渡してください。
            最後に `gh pr comment` で、重大な指摘と提案をまとめた総評を必ず投稿してください。
            レビュー結果は GitHub のコメントとしてのみ投稿し、メッセージ本文として返さないでください。
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(npm test:*),Bash(npm run build:*)"
            --max-turns 20
